<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bazaar · Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box} :root{--bg:#0f1419;--surface:#1a2847;--surface2:#253a5c;--border:#2d4a7c;--ink:#f0f4f8;--muted:#a0aec0;--accent:#3b82f6;--green:#10b981;--red:#ef4444;--yellow:#fbbf24} body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px 'DM Sans',sans-serif} button,input{font:inherit}.hidden{display:none!important}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#1e3a66 0,transparent 35%),var(--bg)}.auth-card{width:min(420px,100%);padding:36px;background:rgba(26,40,71,.96);border:1px solid var(--border);border-radius:16px;box-shadow:0 18px 60px #0006}.brand{font:700 32px 'Playfair Display',serif;color:var(--ink);margin-bottom:8px}.brand span{color:var(--accent)}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.auth-card h1{font:600 28px 'Playfair Display',serif;margin:12px 0 8px}.muted{color:var(--muted)}.field{margin-top:18px}.field label{display:block;margin-bottom:7px;color:#cbd5e1;font-weight:600}.field input{width:100%;padding:12px 14px;color:var(--ink);background:#0f1419;border:1px solid var(--border);border-radius:8px;outline:none}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #3b82f633}.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}.btn-primary{background:var(--accent);color:white}.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.auth-card .btn{width:100%;margin-top:22px}.message{min-height:22px;margin-top:14px;color:#fca5a5}.shell{display:flex;min-height:100vh}.sidebar{width:245px;padding:26px 16px;background:#121d32;border-right:1px solid var(--border)}.sidebar .brand{font-size:26px;padding:0 12px 28px}.nav{display:grid;gap:7px}.nav button{width:100%;text-align:left;background:transparent;color:var(--muted);border:0;border-radius:8px;padding:12px 14px;cursor:pointer}.nav button:hover,.nav button.active{background:var(--surface2);color:var(--ink)}.main{flex:1;min-width:0;padding:28px 34px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.topbar h1{font:600 30px 'Playfair Display',serif;margin:0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card,.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px}.card{padding:20px}.card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.card .value{font-size:28px;font-weight:700;margin-top:8px}.panel{margin-top:22px;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}.panel-head h2{font:600 21px 'Playfair Display',serif;margin:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 20px;border-bottom:1px solid #2d4a7c66;white-space:nowrap}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}td{color:#e2e8f0}.badge{display:inline-block;padding:4px 9px;border-radius:99px;font-size:12px;background:#253a5c;color:#bfdbfe}.badge.active{background:#064e3b;color:#a7f3d0}.badge.pending{background:#78350f;color:#fde68a}.empty{padding:30px 20px;color:var(--muted)}.error{color:#fca5a5;padding:20px}.loading{padding:30px 20px;color:var(--muted)}@media(max-width:800px){.sidebar{width:190px}.main{padding:22px 16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.shell{display:block}.sidebar{width:auto;border-right:0;border-bottom:1px solid var(--border);padding:16px}.sidebar .brand{padding:0 0 14px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.topbar{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <section id="auth-view" class="auth-wrap">
    <main class="auth-card">
      <div class="brand">Bazaar<span>.</span></div>
      <div class="eyebrow">Private administration</div>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to manage users, products, and orders.</p>
      <form id="admin-login">
        <div class="field"><label for="email">Administrator email</label><input id="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary" type="submit">Sign in to admin panel</button>
        <div id="message" class="message" role="alert"></div>
      </form>
    </main>
  </section>

  <section id="panel-view" class="shell hidden">
    <aside class="sidebar"><div class="brand">Bazaar<span>.</span></div><nav class="nav"><button class="active" data-section="overview">Overview</button><button data-section="users">Users</button><button data-section="products">Products</button><button data-section="orders">Orders</button><button id="logout" class="nav-logout">Sign out</button></nav></aside>
    <main class="main"><div class="topbar"><div><div class="eyebrow">Administrator workspace</div><h1 id="section-title">Dashboard overview</h1></div><span id="admin-name" class="muted"></span></div><div id="content"><div class="loading">Loading dashboard…</div></div></main>
  </section>

  <script>
    const authView=document.getElementById('auth-view'),panelView=document.getElementById('panel-view'),message=document.getElementById('message'),content=document.getElementById('content'),title=document.getElementById('section-title');
    let token=localStorage.getItem('token'), currentUser=JSON.parse(localStorage.getItem('user')||'null');
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function api(path,options={}){const response=await fetch('/api'+path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{}) ,...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||'Request failed');return data}
    function showAuth(error=''){authView.classList.remove('hidden');panelView.classList.add('hidden');message.textContent=error}
    function showPanel(){authView.classList.add('hidden');panelView.classList.remove('hidden');document.getElementById('admin-name').textContent=currentUser?.name||currentUser?.email||'Administrator';loadSection('overview')}
    function statsHtml(stats){return `<div class="cards"><div class="card"><div class="label">Total users</div><div class="value">${stats.total_users??0}</div></div><div class="card"><div class="label">Sellers</div><div class="value">${stats.total_sellers??0}</div></div><div class="card"><div class="label">Products</div><div class="value">${stats.total_products??0}</div></div><div class="card"><div class="label">Orders</div><div class="value">${stats.total_orders??0}</div></div></div>`}
    function table(titleText,headers,rows){return `<section class="panel"><div class="panel-head"><h2>${titleText}</h2></div><div class="table-wrap">${rows.length?`<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`:'<div class="empty">No records found.</div>'}</div></section>`}
    async function loadSection(section){document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===section));title.textContent={overview:'Dashboard overview',users:'Registered users',products:'Product listings',orders:'Marketplace orders'}[section];content.innerHTML='<div class="loading">Loading…</div>';try{if(section==='overview'){const d=await api('/admin/dashboard');content.innerHTML=statsHtml(d.stats)+table('Recent orders',['Order','Product','Buyer','Status'],d.recent_orders.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.product_title)}</td><td>${esc(o.buyer_name)}</td><td><span class="badge">${esc(o.status)}</span></td></tr>`))}else if(section==='users'){const users=await api('/admin/users');content.innerHTML=table('All registered users',['Name','Email','Role','Status','Joined'],users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><span class="badge">${esc(u.role)}</span></td><td><span class="badge ${u.is_active?'active':''}">${u.is_active?'Active':'Suspended'}</span></td><td>${esc(u.created_at)}</td></tr>`))}else if(section==='products'){const products=await api('/admin/products');content.innerHTML=table('All products',['Title','Seller','Price','Stock','Status'],products.map(p=>`<tr><td>${esc(p.title)}</td><td>${esc(p.seller_name)}</td><td>${Number(p.price).toLocaleString()}</td><td>${p.stock}</td><td><span class="badge ${p.status==='pending'?'pending':''}">${esc(p.status)}</span></td></tr>`))}else{const orders=await api('/admin/orders');content.innerHTML=table('All orders',['Order','Product','Buyer','Seller','Total','Status'],orders.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.product_title)}</td><td>${esc(o.buyer_name)}</td><td>${esc(o.seller_name)}</td><td>${Number(o.total_price).toLocaleString()}</td><td><span class="badge">${esc(o.status)}</span></td></tr>`))}}catch(error){content.innerHTML=`<div class="error">${esc(error.message)}</div>`}}
    document.querySelectorAll('[data-section]').forEach(button=>button.addEventListener('click',()=>loadSection(button.dataset.section)));
    document.getElementById('admin-login').addEventListener('submit',async event=>{event.preventDefault();message.textContent='Signing in…';try{const data=await api('/auth/login',{method:'POST',body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});if(!data.user||data.user.role!=='admin')throw new Error('Administrator access required');token=data.token;currentUser=data.user;localStorage.setItem('token',token);localStorage.setItem('user',JSON.stringify(currentUser));showPanel()}catch(error){token=null;message.textContent=error.message}});
    document.getElementById('logout').addEventListener('click',()=>{token=null;currentUser=null;localStorage.removeItem('token');localStorage.removeItem('user');showAuth()});
    (async()=>{if(!token||!currentUser||currentUser.role!=='admin'){showAuth();return}try{const user=await api('/auth/me');if(user.role!=='admin')throw new Error();currentUser=user;showPanel()}catch{token=null;currentUser=null;localStorage.removeItem('token');localStorage.removeItem('user');showAuth()}})();
  </script>
</body>
</html>
